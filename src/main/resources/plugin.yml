name: SHEggDragonBoss
version: '${project.version}'
main: org.Cry_Legende.sHEggDragonBoss.SHEggDragonBoss
api-version: '1.20'
author: Cry_Legende
description: Deux boss d'île lancés par un rituel (le Jeune Ender Dragon et le Creaking).
depend: [SuperiorSkyblock2, FancyHolograms]
softdepend: [SHLogs]

commands:
  sheggdragonboss:
    description: Administration de SHEggDragonBoss (reload, give).
    usage: /sheggdragonboss <reload|give|help>
    aliases: [shboss]
    permission: sheggdragonboss.admin

permissions:
  sheggdragonboss.admin:
    description: Accès à /sheggdragonboss (recharger la configuration, donner les objets du rituel du Creaking).
    default: op

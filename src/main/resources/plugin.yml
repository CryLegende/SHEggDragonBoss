name: SHEggDragonBoss
version: '${project.version}'
main: org.Cry_Legende.sHEggDragonBoss.SHEggDragonBoss
api-version: '1.20'
author: Cry_Legende
description: Deux boss d'île lancés par un rituel (le Jeune Ender Dragon et le Creaking).
depend: [SuperiorSkyblock2, FancyHolograms]
# SHNetwork et SHSkyBridge sont facultatifs : sans eux, le plugin se comporte comme sur un serveur seul.
softdepend: [SHLogs, PremiumVanish, SuperVanish, Essentials, SHNetwork, SHSkyBridge]

commands:
  sheggdragonboss:
    description: Administration de SHEggDragonBoss (reload, give, list).
    usage: /sheggdragonboss <reload|give|list>
    aliases: [shboss]
    permission: sheggdragonboss.admin.reload;sheggdragonboss.admin.give;sheggdragonboss.admin.list

permissions:
  sheggdragonboss.admin:
    description: Toutes les commandes d'administration de SHEggDragonBoss.
    default: op
    children:
      sheggdragonboss.admin.reload: true
      sheggdragonboss.admin.give: true
      sheggdragonboss.admin.list: true
  sheggdragonboss.admin.reload:
    description: /sheggdragonboss reload (recharger config.yml et messages.yml).
    default: op
  sheggdragonboss.admin.give:
    description: /sheggdragonboss give (donner les objets du rituel du Creaking).
    default: op
  sheggdragonboss.admin.list:
    description: /sheggdragonboss list (boss et rituels en cours).
    default: op

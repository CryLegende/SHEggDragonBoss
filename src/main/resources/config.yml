# ----------------------------------------------------------------#
#                Configuration de SHEggDragonBoss                 #
# ----------------------------------------------------------------#
#
# Le plugin gère deux boss. Chacun est lancé par un rituel : clic droit sur un bloc avec un objet,
# puis compte à rebours, puis apparition du boss.
#   dragon   : bloc DRAGON_EGG + éclats d'écho  -> Phantom « Jeune Ender Dragon » qui tourne autour des joueurs de l'île,
#              plonge sur eux et rugit à chaque seuil de PV.
#   creaking : bloc CREAKING_HEART + briques de résine -> Creaking à l'IA vanilla, invulnérable par phases
#              tant qu'il reste des cœurs à détruire autour de lui.
# Une île n'a jamais qu'un seul boss (n'importe lequel) ou rituel en cours à la fois.
# Les deux boss : ne visent jamais les joueurs invisibles (vanish), en créatif ou en spectateur ; meurent en plusieurs temps
# (section death) ; récompensent celui qui porte le coup fatal, et lui seul (section rewards).
#
# Commandes :
#   /sheggdragonboss reload                                       Recharge config.yml et messages.yml.
#   /sheggdragonboss give <joueur> <coeur|briques> (quantité)     Donne le cœur ou les briques du rituel du Creaking.
#   Alias : /shboss.
#
# Permissions :
#   sheggdragonboss.admin   Utiliser /sheggdragonboss (op par défaut).
#   Le rituel lui-même demande le privilège d'île de la section island-permission.
#
# Le journal des boss est écrit dans le fichier boss de SHLogs. Ses lignes sont dans messages.yml, section journal.
#
# Organisation du fichier :
#   rituals           : bloc, objet, quantité, compte à rebours, hologramme et animation de chaque rituel
#   sounds            : sons de chaque rituel
#   bosses            : réglages de combat de chaque boss
#   island-permission : privilège d'île (SuperiorSkyblock2) nécessaire pour lancer un rituel
#   reseau            : mode réseau (plusieurs serveurs se partagent les îles, avec SHSkyBridge)
#
# Les textes (messages, titres, noms, barres de boss, hologrammes, lores) sont dans messages.yml.
# Ce fichier est lu au démarrage du serveur et par /sheggdragonboss reload (les boss en cours appliquent les
# nouveaux réglages au tick suivant ; le nom du privilège d'île n'est lu qu'au démarrage).
# Une clé absente ou une valeur invalide (matériau, son, particule, entité, effet inconnu...) produit un
# avertissement dans la console et la valeur livrée avec le plugin est utilisée. Rien ne plante.
#
# Conventions :
#   Couleurs      : codes Minecraft avec '&'. Exemple : '&cRouge &l&ngras souligné'.
#   Sons          : nom Bukkit (ENTITY_ENDER_DRAGON_GROWL) ou clé (minecraft:entity.ender_dragon.growl).
#                   Chaque son a un volume (0 = muet, au-delà de 1 le son porte plus loin) et une hauteur
#                   (pitch : 0.5 grave à 2.0 aigu). Un nom vide ("") désactive le son.
#   Particules    : nom de particule Bukkit sans données (CLOUD, SCULK_SOUL...). BLOCK, DUST, ITEM... sont refusées.
#                   Un nom vide ("") désactive l'effet. count = nombre, spread = dispersion en blocs, speed = vitesse.
#   Durées        : en ticks (20 ticks = 1 seconde) quand la clé se termine par -ticks, sinon en secondes.
#   Listes        : une liste vide s'écrit '[]'. Attention : une liste laissée sans valeur reprend la liste livrée.

# ----------------------------------------------------------------#
#                            RITUELS                              #
# ----------------------------------------------------------------#
# Un rituel : clic droit sur le bloc avec l'objet (Shift = toute la pile) jusqu'à la quantité requise.
# Le bloc est alors consommé et un affichage du bloc grossit pendant le compte à rebours, puis le boss apparaît.
# Casser le bloc avant le compte à rebours rend les objets donnés ; pendant le compte à rebours c'est refusé.
# Les textes (messages du rituel, hologramme) sont dans messages.yml, section rituals.
rituals:
  dragon:
    # false : ce rituel est ignoré (le bloc redevient un bloc ordinaire).
    enabled: true
    # Bloc à cliquer. Nom de matériau valide. Deux rituels ne peuvent pas avoir le même bloc.
    block: "DRAGON_EGG"
    # Objet à donner. Nom de matériau valide.
    item: "ECHO_SHARD"
    # Nombre total d'objets requis pour lancer le compte à rebours (au moins 1).
    required-amount: 15
    # Durée du compte à rebours avant l'apparition du boss (au moins 1).
    countdown-seconds: 10
    # Hauteur, en blocs au-dessus du bloc, où le boss apparaît.
    spawn-offset-y: 2.0
    hologram:
      # Début du nom de l'hologramme. Un nom différent par rituel (lettres, chiffres, _ . -).
      name-prefix: "sHEDragon"
      # Hauteur de l'hologramme au-dessus du bloc, avant le compte à rebours.
      height: 1.3
      # Ombre portée sur le texte pour une meilleure lisibilité.
      text-shadow: true
      # Hauteur et taille (échelle) de l'hologramme PENDANT le compte à rebours.
      countdown-height: 2.5
      countdown-scale: 3.0
    # Animation du bloc pendant le compte à rebours.
    animation:
      # Taille ajoutée à la fin du compte à rebours (1.5 : le bloc passe de 1 à 2.5 fois sa taille).
      growth: 1.5
      # Hauteur maximale de lévitation, en blocs, atteinte à la fin.
      levitation: 0.35
      # Vitesse de l'oscillation de lévitation, en radians par tick.
      levitation-speed: 0.125
      # Tremblement du bloc (angle maximal en radians), de plus en plus fort jusqu'à la fin.
      wobble: 0.2
    particles:
      # À chaque objet donné.
      add-item:
        particle: "SCULK_SOUL"
        count: 20
        spread: 0.5
        speed: 0.1
      # Pendant le compte à rebours, chaque tick. Le nombre grossit jusqu'à count × (1 + count-growth).
      countdown:
        particle: "PORTAL"
        count: 10
        count-growth: 4.0
        spread: 0.8
        speed: 0.1

  creaking:
    enabled: true
    block: "CREAKING_HEART"
    item: "RESIN_BRICK"
    required-amount: 10
    countdown-seconds: 10
    # Le Creaking apparaît à la place du bloc consommé.
    spawn-offset-y: 0.0
    hologram:
      name-prefix: "sHECreaking"
      height: 1.3
      text-shadow: true
      countdown-height: 2.5
      countdown-scale: 3.0
    animation:
      growth: 1.5
      levitation: 0.35
      levitation-speed: 0.125
      wobble: 0.2
    particles:
      add-item:
        particle: "FALLING_HONEY"
        count: 15
        spread: 0.4
        speed: 0.0
      countdown:
        particle: "SCULK_SOUL"
        count: 6
        count-growth: 4.0
        spread: 0.8
        speed: 0.05

# ----------------------------------------------------------------#
#                             SONS                                #
# ----------------------------------------------------------------#
# Sons des rituels. add-item : un objet est donné. start : le compte à rebours démarre.
# countdown-tick : chaque seconde du compte à rebours ; sa hauteur monte de pitch-growth jusqu'à la fin.
sounds:
  dragon:
    add-item:
      sound: "ENTITY_ELDER_GUARDIAN_HURT"
      volume: 1.0
      pitch: 0.1
    start:
      sound: "ENTITY_ENDER_DRAGON_GROWL"
      volume: 2.0
      pitch: 0.1
    countdown-tick:
      sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
      volume: 1.0
      pitch: 0.1
      pitch-growth: 1.0
  creaking:
    add-item:
      sound: "BLOCK_RESIN_BRICKS_PLACE"
      volume: 1.0
      pitch: 0.8
    start:
      sound: "ENTITY_CREAKING_ACTIVATE"
      volume: 2.0
      pitch: 0.5
    countdown-tick:
      sound: "BLOCK_CREAKING_HEART_IDLE"
      volume: 1.5
      pitch: 0.6
      pitch-growth: 0.8

# ----------------------------------------------------------------#
#                             BOSS                                #
# ----------------------------------------------------------------#
bosses:
  # ---------------------------------------------------------------
  # Boss n°1 : le « Jeune Ender Dragon » (Phantom sans IA, déplacé par le plugin). Il tourne autour d'un joueur en lui crachant
  # des boules de feu, plonge sur un joueur tiré au hasard, et rugit à chaque seuil de PV :
  #   - plongeon : il se cabre au-dessus de sa proie, fixe l'endroit visé (un cercle de particules l'indique au sol), puis
  #     fond dessus. L'impact blesse tout ce qui est autour ; il reste ensuite étourdi et encaisse plus de dégâts ;
  #   - rugissement : à chaque seuil de `phases` il est invulnérable un instant, puis un souffle repousse tout le monde. Il est
  #     ensuite plus rapide (phase-speed-bonus), attaque plus souvent (phase-speedup) et tire plus de boules de feu ;
  #   - ses dégâts « réels » (un pourcentage des PV max du joueur) traversent l'armure, et aucun coup ne lui retire plus de
  #     max-hit-percent % de ses PV : un équipement complet ne le fait pas tomber en quelques secondes.
  # Il ne vise ni les joueurs invisibles (vanish), ni ceux en créatif ou en spectateur.
  # ---------------------------------------------------------------
  dragon:
    # Type de créature : une créature vivante invocable (PHANTOM).
    entity-type: "PHANTOM"
    # Barre de boss vue par les membres de l'île (titre : messages.yml, bosses.dragon). Elle rougit à la deuxième phase.
    # color : PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE. style : SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20.
    bossbar:
      color: "PURPLE"
      style: "SOLID"
    # PV de base. Les PV réels ajoutent dynamic-stats (voir plus bas).
    health: 600.0
    # Taille du Phantom.
    phantom-size: 7

    # --- COMBAT ---
    # Morsure (le joueur le plus proche, s'il est à melee-range blocs de sa gueule) : dégâts normaux (arrêtés par l'armure),
    # part des PV max du joueur retirée en plus directement (0 : désactivé), délai entre deux morsures.
    attack-damage: 35.0
    melee-true-damage-percent: 4.0
    melee-range: 4.0
    attack-cooldown-ticks: 40
    # Vitesse de déplacement maximale (1 = 0.1 bloc par tick). Chaque phase l'augmente de phase-speed-bonus.
    movement-speed-multiplier: 7
    # Aucun coup ne retire plus de ce pourcentage des PV max du boss (0 : pas de plafond). 1.2 % = au moins 84 coups,
    # quelle que soit la force du coup.
    max-hit-percent: 1.2
    # Causes de dégâts ignorées par le boss. Noms de EntityDamageEvent.DamageCause.
    immune-damage-causes:
      - SUFFOCATION
      - ENTITY_EXPLOSION
      - BLOCK_EXPLOSION
    # Seuils de PV (en % du maximum) où il rugit. Chaque seuil ne se déclenche qu'une fois. Pour n'avoir aucune phase : 'phases: []'.
    phases:
      - 75
      - 50
      - 25
    # Chaque phase franchie : ses délais (salves, plongeons) sont multipliés par ce facteur (0.85 : 15 % plus court) et sa
    # vitesse augmente de ce bonus (0.12 : 12 %).
    phase-speedup: 0.85
    phase-speed-bonus: 0.12

    # --- VOL ---
    # Il tourne autour de la joueuse ou du joueur le plus proche : rayon du cercle, hauteur au-dessus de ses yeux, vitesse du
    # tour en degrés par tick (4 = un tour en 4,5 secondes).
    flight:
      orbit-radius: 9.0
      orbit-height: 4.0
      orbit-degrees-per-tick: 4.0

    # --- ATTAQUE À DISTANCE (salve de boules de feu du dragon) ---
    ranged-attack:
      enabled: true
      # Temps en ticks entre chaque salve.
      cooldown-ticks: 100
      # Distance minimale (au carré) pour tirer : 25.0 = 5 blocs. Distance maximale en blocs. La cible est tirée au hasard
      # parmi les joueurs à portée.
      min-range-squared: 25.0
      max-range: 40.0
      # Boules de feu par salve, et boules de feu en plus à chaque phase franchie (au plus 9 en tout).
      fireballs: 3
      fireballs-per-phase: 1
      sound:
        sound: "ENTITY_ENDER_DRAGON_SHOOT"
        volume: 3.0
        pitch: 1.0

    # --- PLONGEON ---
    dive:
      enabled: true
      # Délai entre la fin d'un plongeon (ou du réveil) et le suivant.
      cooldown-ticks: 220
      # Le joueur visé est tiré au hasard parmi ceux qui sont à moins de range blocs.
      range: 32.0
      # Temps total de la mise en position, en ticks : le dragon se cabre au-dessus de sa proie (qu'il suit), puis pendant les
      # lock-ticks derniers ticks l'endroit visé est fixé (cercle de particules) et il ne bouge plus.
      warning-ticks: 32
      lock-ticks: 14
      # Vitesse de la descente, en blocs par tick.
      speed: 1.7
      # Rayon de l'impact, en blocs (c'est aussi le rayon du cercle d'avertissement).
      hit-radius: 4.5
      # Dégâts normaux (arrêtés par l'armure), part des PV max des joueurs touchés retirée en plus directement, recul.
      damage: 28.0
      true-damage-percent: 12.0
      knockback: 1.2
      # Durée de l'étourdissement après l'impact, et multiplicateur des dégâts qu'il reçoit pendant ce temps (appliqué après le
      # plafond max-hit-percent).
      stun-ticks: 50
      stun-damage-multiplier: 1.5
      # Entendu autour du dragon et par le joueur visé, au début de la mise en position.
      warning-sound:
        sound: "ENTITY_ENDER_DRAGON_GROWL"
        volume: 3.0
        pitch: 1.4
      # Cercle d'avertissement au sol : count = nombre de points du cercle.
      warning-particles:
        particle: "FLAME"
        count: 32
        speed: 0.0
      impact-sound:
        sound: "ENTITY_GENERIC_EXPLODE"
        volume: 3.0
        pitch: 0.7
      impact-particles:
        particle: "EXPLOSION_EMITTER"
        count: 2
        spread: 1.2
        speed: 0.0
      # Autour de sa tête pendant l'étourdissement.
      stun-particles:
        particle: "ELECTRIC_SPARK"
        count: 6
        spread: 1.0
        speed: 0.2

    # --- RUGISSEMENT (à chaque seuil de `phases`) ---
    roar:
      enabled: true
      # Durée pendant laquelle le dragon est invulnérable, se cabre et tremble.
      duration-ticks: 50
      # Souffle final : rayon en blocs, dégâts normaux, part des PV max retirée en plus directement, recul horizontal et vertical.
      radius: 11.0
      damage: 16.0
      true-damage-percent: 6.0
      knockback-horizontal: 1.9
      knockback-vertical: 0.7
      start-sound:
        sound: "ENTITY_ENDER_DRAGON_GROWL"
        volume: 6.0
        pitch: 0.6
      blast-sound:
        sound: "ENTITY_WARDEN_SONIC_BOOM"
        volume: 3.0
        pitch: 0.7
      # Autour du dragon pendant qu'il rugit.
      aura-particles:
        particle: "PORTAL"
        count: 14
        spread: 1.4
        speed: 0.6
      # Anneau du souffle : count = nombre de points de l'anneau.
      blast-particles:
        particle: "CLOUD"
        count: 72
        speed: 0.0

    # --- EFFETS D'APPARITION ---
    spawn-explosion:
      enabled: true
      # Puissance (4.0 = TNT, 8.0 = Creeper chargé).
      power: 10.0
      set-fire: true
      break-blocks: false

    # --- SONS ---
    spawn-sound:
      sound: "ENTITY_ENDER_DRAGON_GROWL"
      volume: 8.0
      pitch: 2.0
    # delay : secondes entre deux sons d'ambiance (au moins 1).
    ambient-sound:
      sound: "ENTITY_ENDER_DRAGON_GROWL"
      volume: 4.0
      pitch: 2.0
      delay: 5
    # Joué à la mort, après le final (voir death).
    death-sound:
      sound: "ENTITY_WITHER_DEATH"
      volume: 2.0
      pitch: 0.5
    hurt-sound:
      sound: "ENTITY_WITHER_HURT"
      volume: 2.0
      pitch: 0.1
    # Un coup est reçu pendant le rugissement (invulnérable).
    blocked-sound:
      sound: "BLOCK_ANVIL_LAND"
      volume: 1.0
      pitch: 1.6

    # --- PARTICULES ---
    particles:
      # Autour du boss, toutes les interval-ticks ticks.
      ambient:
        enabled: true
        particle: "REVERSE_PORTAL"
        count: 5
        speed: 0.05
        interval-ticks: 4

    # --- MORT ---
    # Le coup fatal est retenu : le dragon s'affaisse en tournant sur lui-même de plus en plus vite, tremble, des particules
    # l'entourent en spirale et le son monte ; puis le final éclate (explosion, éclats, deux anneaux qui s'élargissent, colonne
    # de lumière) et le coup de grâce tombe. Les récompenses sont données à ce moment. Le vide et /kill passent sans scène.
    death:
      enabled: true
      duration-ticks: 90
      # Tremblement (blocs) atteint à la fin, hauteur gagnée (négatif : il s'affaisse) et vitesse de rotation atteinte à la
      # fin (degrés par tick, 0 : il ne tourne pas).
      shake: 0.35
      lift: -2.5
      spin-degrees: 35.0
      # Éclats projetés au final : un bloc (vide : aucun) et leur nombre.
      debris: "OBSIDIAN"
      debris-count: 90
      # Au début de la mort.
      start-sound:
        sound: "ENTITY_ENDER_DRAGON_GROWL"
        volume: 6.0
        pitch: 0.5
      # Toutes les pulse-interval-ticks ticks ; la hauteur monte de pulse-pitch-growth jusqu'à la fin.
      pulse-sound:
        sound: "ENTITY_ENDER_DRAGON_HURT"
        volume: 3.0
        pitch: 0.6
      pulse-interval-ticks: 10
      pulse-pitch-growth: 1.0
      # Spirale autour du boss, chaque tick : count = nombre de points.
      aura-particles:
        particle: "END_ROD"
        count: 8
        speed: 0.0
      # Cœur de l'explosion finale.
      burst-particles:
        particle: "EXPLOSION_EMITTER"
        count: 3
        spread: 2.0
        speed: 0.0
      # Anneaux qui s'élargissent jusqu'à ring-radius blocs : count = nombre de points par anneau.
      ring-particles:
        particle: "END_ROD"
        count: 56
        speed: 0.0
      ring-radius: 14.0
      # Colonne de lumière qui monte jusqu'à pillar-height blocs.
      pillar-particles:
        particle: "END_ROD"
        count: 2
        spread: 0.3
        speed: 0.02
      pillar-height: 28.0
      finale-sound:
        sound: "ENTITY_ENDER_DRAGON_DEATH"
        volume: 8.0
        pitch: 1.0
      finale-extra-sound:
        sound: "ENTITY_GENERIC_EXPLODE"
        volume: 4.0
        pitch: 0.8
      # Entendu par les joueurs qui suivaient le combat.
      victory-sound:
        sound: "UI_TOAST_CHALLENGE_COMPLETE"
        volume: 1.0
        pitch: 1.0

    # --- RÉCOMPENSES ---
    # Elles vont à celui qui porte le coup fatal, et à lui seul. S'il s'est déconnecté pendant la mort en scène ou si le boss
    # tombe d'une autre cause, le joueur qui a le plus infligé au boss le remplace.
    rewards:
      # Points d'expérience donnés au tueur.
      xp-reward: 15000
      # Nombre de fois que le tueur lance roll-commands.
      rolls: 2
      # Lancées une fois pour le tueur. Placeholders : {player} le tueur, {island} le nom de l'île (sinon de son propriétaire),
      # {world}, {x}, {y}, {z}. Pas de ';' : une commande par ligne.
      commands: []
      # Lancées `rolls` fois pour le tueur (le tirage au sort).
      roll-commands:
        - "rc dragonegg-rewards {player}"
      # Objets lâchés à la mort du boss. Pour n'en lâcher aucun, écrire 'items: []'.
      # Exemple d'objet personnalisé :
      #   - material: "DIAMOND"
      #     amount: 10
      #     name: "&bFragment du Vide"
      #     lore:
      #       - "&7Un diamant imprégné de"
      #       - "&7l'énergie du Phantom."
      items:
        - material: "PHANTOM_MEMBRANE"
          amount: 1

    # PV dynamiques : PV de base + health-per-island-level × niveau de l'île + health-per-island-member × membres.
    dynamic-stats:
      enabled: true
      health-per-island-level: 0.0005
      health-per-island-member: 40.0

  # ---------------------------------------------------------------
  # Boss n°2 : le Creaking. IA vanilla active : il poursuit les joueurs, les frappe, et se fige quand un joueur
  # le regarde (mécanique du jeu, pas du plugin). Le plugin joue sur ce regard :
  #   - le Noir : un éclair d'obscurité de moins d'une seconde, sans annonce, qui revient souvent. Il aveugle les joueurs
  #     proches ; un joueur aveuglé ne le fige plus, alors le boss se téléporte derrière eux et plante autant de coups que de
  #     combattants (chaque coup est annoncé par un craquement, on l'esquive en s'éloignant) ;
  #   - le Sursaut : frappé sur place sans répit, il finit par se téléporter derrière celui qui le frappe le plus et le frapper ;
  #   - quand ses PV passent sous un seuil, il devient invulnérable et des cœurs apparaissent autour de lui : tant
  #     qu'il en reste, il ne perd aucun PV. On les brise en les FRAPPANT (clic gauche répété), pas en les minant ;
  #   - ses dégâts « réels » (un pourcentage des PV max du joueur) traversent armure, protections et absorption,
  #     et aucun coup ne lui retire plus de max-hit-percent % de ses PV : un équipement complet ne le fait pas tomber en quelques secondes.
  # Il ne quitte jamais l'île.
  # ---------------------------------------------------------------
  creaking:
    # Barre de boss (titres : messages.yml, bosses.creaking). Elle change de titre, de couleur et de style
    # pendant une phase d'invulnérabilité (shield-*).
    bossbar:
      color: "WHITE"
      style: "SOLID"
      shield-color: "RED"
      shield-style: "SOLID"

    # --- STATISTIQUES ---
    # PV de base ; les PV réels ajoutent dynamic-stats : base + par niveau d'île × niveau + par membre × membres.
    health: 800.0
    dynamic-stats:
      enabled: true
      health-per-island-level: 0.0003
      health-per-island-member: 20.0
    # Dégâts de la frappe vanilla (corps à corps).
    attack-damage: 20.0
    # À chaque frappe de mêlée, part des PV MAX du joueur retirée en plus, directement : ni l'armure, ni les
    # enchantements de protection, ni l'absorption ne l'arrêtent (0 : désactivé). Voir aussi les attaques ci-dessous.
    melee-true-damage-percent: 5.0
    # Vitesse de déplacement (attribut vanilla ; le Creaking vanilla marche à 0.4). Relue à chaud.
    movement-speed: 0.6
    # Armure (0 à 30) et robustesse (0 à 20) : réduisent les dégâts reçus comme pour un joueur.
    armor: 8.0
    armor-toughness: 2.0
    # Résistance au recul, de 0 (aucune) à 1 (insensible).
    knockback-resistance: 0.8
    # Distance, en blocs, à laquelle il repère les joueurs.
    follow-range: 40.0
    # true : chaque seconde, si l'IA vanilla l'a laissé inactif alors qu'un joueur de l'île est là, le plugin
    # l'éveille vers lui (Creaking#activate). Le gel quand on le regarde reste celui du jeu.
    assist-activation: true
    # Intervalle, en ticks, entre deux contrôles de l'arène et des attaques.
    check-interval-ticks: 5
    # Causes de dégâts ignorées par le boss. Noms de EntityDamageEvent.DamageCause.
    # PROJECTILE : le Creaking se fige quand on le regarde et ses attaques ne portent qu'à 6-8 blocs, un arc le tuerait
    # sans aucun risque ; il se combat donc au corps à corps.
    immune-damage-causes:
      - PROJECTILE
      - SUFFOCATION
      - ENTITY_EXPLOSION
      - BLOCK_EXPLOSION
      - FIRE
      - FIRE_TICK
      - LAVA
      - HOT_FLOOR
    # Aucun coup ne retire plus de ce pourcentage des PV max du boss (0 : pas de plafond). Face à un équipement complet
    # enchanté, c'est ce plafond qui fixe la durée minimale du combat : 0.5 % = au moins 200 coups, quelle que soit la force
    # du coup. Les phases d'invulnérabilité s'y ajoutent.
    max-hit-percent: 0.5

    # --- ARÈNE ---
    # Hors de l'île, ou à plus de max-depth-below-center blocs sous le centre de l'île (vide), le boss est ramené
    # au centre de l'île, à recenter-offset-y blocs au-dessus.
    arena:
      max-depth-below-center: 30.0
      recenter-offset-y: 1.0
      # Un joueur dont les blocs sous les pieds sont vides sur cette hauteur est « en l'air » (vol, élytres, grand saut) :
      # le boss le rejoint à sa hauteur, sans gravité, le temps de sa frappe (Noir et Sursaut), puis redescend au sol.
      airborne-clearance: 3

    # --- PHASES D'INVULNÉRABILITÉ ---
    # Quand les PV passent sous health-percent % du maximum, le boss devient invulnérable et `hearts` cœurs
    # apparaissent autour de lui. Quand le dernier tombe, il redevient vulnérable. Une phase par entrée,
    # chaque phase ne se déclenche qu'une fois. health-percent est entre 0 et 100 exclus, hearts au moins 1.
    # Pour n'avoir aucune phase, écrire 'phases: []'.
    phases:
      - health-percent: 80
        hearts: 3
      - health-percent: 60
        hearts: 4
      - health-percent: 40
        hearts: 5
      - health-percent: 20
        hearts: 6
    # Cœurs en plus par combattant au-delà du premier (joueurs de l'île à moins de hearts.guide.range blocs du boss), arrondi,
    # sans jamais dépasser le double des cœurs de la phase. 0.5 : deux joueurs de plus = un cœur de plus.
    hearts-per-extra-player: 0.5

    # --- CŒURS ---
    # Des cœurs éveillés flottent sur des blocs d'air de l'île, dans la couche du boss, avec un bloc solide dessous quand
    # c'est possible. Ce sont des affichages de bloc (pas de vrais blocs) : ils ne comptent pas dans le niveau de l'île,
    # ne se minent pas et aucune protection d'île ne les bloque. On les détruit en les frappant (clic gauche, maintenu ou répété).
    hearts:
      # Nombre de coups pour détruire un cœur.
      hits-to-break: 6
      # Délai minimal entre deux coups d'un même joueur, en secondes (anti-spam, aussi quand le clic est maintenu).
      hit-cooldown-seconds: 0.3
      # Distance au boss, en blocs, entre min-distance et max-distance.
      min-distance: 4.0
      max-distance: 10.0
      # Les cœurs sont posés à la hauteur du boss ± cette valeur, en blocs.
      vertical-range: 3
      # Distance minimale entre deux cœurs, en blocs.
      min-spacing: 3.0
      # Emplacements tirés au hasard avant d'abandonner, à chaque tentative.
      placement-attempts: 200
      # Tentatives supplémentaires (une par seconde) quand tous les cœurs n'ont pas pu être posés ;
      # ensuite les cœurs manquants ne comptent plus dans la phase.
      placement-retries: 10
      place-sound:
        sound: "BLOCK_CREAKING_HEART_SPAWN"
        volume: 1.5
        pitch: 1.0
      place-particles:
        particle: "SCULK_SOUL"
        count: 20
        spread: 0.4
        speed: 0.05
      # À chaque coup qui ne détruit pas le cœur.
      hit-sound:
        sound: "BLOCK_CREAKING_HEART_HURT"
        volume: 1.0
        pitch: 1.0
      hit-particles:
        particle: "CRIT"
        count: 8
        spread: 0.3
        speed: 0.1
      # Quand le cœur est détruit.
      break-sound:
        sound: "BLOCK_CREAKING_HEART_BREAK"
        volume: 1.5
        pitch: 1.0
      break-particles:
        particle: "POOF"
        count: 20
        spread: 0.4
        speed: 0.05
      # Le joueur voit sa progression dans la barre d'action à chaque coup qui ne détruit pas le cœur (hit-actionbar, messages.yml).
      # Colonne de particules au-dessus de chaque cœur, visible de loin. count = nombre de particules dans la colonne,
      # height = hauteur de la colonne en blocs, interval-ticks = délai entre deux rafraîchissements.
      marker-particles:
        particle: "END_ROD"
        count: 8
        speed: 0.0
        height: 5.0
        interval-ticks: 6
      # Contour lumineux visible à travers les blocs (true/false) et sa couleur (RRGGBB).
      glow: true
      glow-color: "FFAA00"
      # Un cœur brisé compte comme des dégâts infligés au boss, à hauteur de ce pourcentage de ses PV max (pour les récompenses :
      # pendant une phase le boss est invulnérable, les cœurs sont la seule façon de participer).
      credit-percent: 1.0
      # Boussole (guide-actionbar, messages.yml) : à tous les joueurs de l'île à moins de `range` blocs du boss, tant qu'il
      # reste des cœurs. Lisible même quand le joueur est aveuglé.
      guide:
        interval-ticks: 10
        range: 64.0

    # --- ATTAQUES DU PLUGIN ---
    # Elles s'ajoutent à la frappe vanilla et ne dépendent pas du regard des joueurs. Elles touchent les joueurs
    # de l'île qui sont dans le rayon. Une attaque sans joueur à portée ne consomme pas son délai.
    # Pendant une phase d'invulnérabilité, le boss ne frappe plus qu'en mêlée vanille et lance l'onde de choc
    # shield-frequency-factor fois plus souvent ; la résine suit during-shield. Le Noir continue (après un court répit).
    attacks:
      # Onde de choc : dégâts et recul pour les joueurs proches, avec un anneau de particules à la limite.
      shockwave:
        enabled: true
        cooldown-ticks: 160
        # Rayon en blocs.
        radius: 6.0
        # Dégâts (2 = un cœur), arrêtés par l'armure comme tout coup normal.
        damage: 12.0
        # Part des PV max du joueur retirée en plus, directement (ni armure, ni protection, ni absorption). 0 : désactivé.
        true-damage-percent: 6.5
        # Recul : force horizontale (loin du boss) et verticale (vers le haut).
        knockback-horizontal: 1.4
        knockback-vertical: 0.6
        # Pendant une phase, le délai est divisé par ce facteur (2 : deux fois plus souvent ; au moins 1).
        shield-frequency-factor: 2.0
        sound:
          sound: "ENTITY_WARDEN_SONIC_BOOM"
          volume: 1.5
          pitch: 0.8
        # count = nombre de points de l'anneau.
        particles:
          particle: "CLOUD"
          count: 48
          speed: 0.0
      # Résine collante : effets de potion pour les joueurs proches.
      resin:
        enabled: true
        cooldown-ticks: 240
        radius: 8.0
        # true : le boss lance aussi la résine pendant une phase d'invulnérabilité.
        during-shield: false
        # Effets appliqués. type : nom d'effet (SLOWNESS, MINING_FATIGUE...), amplifier : niveau - 1 (2 = niveau III),
        # duration-ticks : durée en ticks (60 = 3 secondes).
        effects:
          - type: "SLOWNESS"
            amplifier: 2
            duration-ticks: 60
          - type: "MINING_FATIGUE"
            amplifier: 0
            duration-ticks: 60
        sound:
          sound: "BLOCK_HONEY_BLOCK_PLACE"
          volume: 1.5
          pitch: 0.6
        # Sur chaque joueur touché.
        particles:
          particle: "FALLING_HONEY"
          count: 15
          spread: 0.4
          speed: 0.0

      # Le Noir : un éclair d'obscurité de moins d'une seconde, sans annonce, qui revient souvent. Les joueurs à portée sont
      # aveuglés ; un joueur aveuglé ne fige plus le Creaking du regard, alors le boss se téléporte derrière eux (craquement à
      # l'arrivée, c'est le seul indice) et plante un coup par combattant (voir hits-per-player). Chaque coup tombe
      # `strike-delay-ticks` après l'arrivée du boss : le joueur l'esquive en s'éloignant de plus de `strike-reach` blocs de
      # l'endroit où le boss est arrivé. Un joueur qui retire son aveuglement (lait...) perd son coup.
      # Sans joueur à portée, rien ne se passe et le délai n'est pas consommé. Les joueurs invisibles (vanish), en créatif ou en
      # spectateur ne sont jamais visés.
      blackout:
        enabled: true
        # Délai entre la fin d'un Noir et le suivant, plus ou moins cooldown-jitter-ticks tirés au hasard (pas de rythme à apprendre).
        cooldown-ticks: 80
        cooldown-jitter-ticks: 30
        # Chaque phase d'invulnérabilité déclenchée multiplie ce délai par ce facteur (0.9 : 10 % plus court par phase).
        phase-cooldown-factor: 0.9
        # Après le début d'une phase, le Noir attend au moins ce délai (le temps de lire le titre et de repérer les cœurs).
        after-phase-delay-ticks: 60
        # Rayon, en blocs, autour du boss.
        radius: 30.0
        # Durée du noir (14 = 0,7 seconde). Il dure plus longtemps si le boss a encore des téléportations à faire (au plus
        # max-hits × blink-interval-ticks).
        duration-ticks: 14
        # Délai avant la première téléportation, puis entre deux téléportations.
        first-blink-delay-ticks: 2
        blink-interval-ticks: 2
        # Coups par joueur à portée (1.0 : autant de coups que de combattants, chacun sur un joueur différent), et plafond.
        hits-per-player: 1.0
        max-hits: 8
        # Distance, en blocs, entre le boss et sa proie à l'arrivée (derrière elle quand c'est possible).
        blink-distance: 2.0
        # Délai entre l'arrivée du boss et son coup : le temps d'entendre le craquement et de s'écarter.
        strike-delay-ticks: 16
        # Portée du coup, en blocs. Au-delà, le joueur l'a esquivé.
        strike-reach: 3.2
        # Dégâts normaux du coup (arrêtés par l'armure) et part des PV max du joueur retirée en plus, directement.
        strike-damage: 18.0
        strike-true-damage-percent: 12.0
        # Force du recul du coup.
        strike-knockback: 0.6
        # true : le nom du boss disparaît pendant l'aveuglement (même aveugle, on le voit à travers le noir).
        hide-name: true
        # Effets appliqués pendant le Noir. type : nom d'effet, amplifier : niveau - 1. La durée est celle du noir.
        effects:
          - type: "blindness"
            amplifier: 0
          - type: "darkness"
            amplifier: 0
        # Craquement à l'arrivée du boss : positionnel, c'est ce qui indique d'où vient la menace.
        blink-sound:
          sound: "ENTITY_CREAKING_ACTIVATE"
          volume: 3.0
          pitch: 0.5
        blink-particles:
          particle: "REVERSE_PORTAL"
          count: 30
          spread: 0.4
          speed: 0.1
        strike-sound:
          sound: "ENTITY_WARDEN_ATTACK_IMPACT"
          volume: 2.0
          pitch: 0.7
        strike-particles:
          particle: "CRIT"
          count: 25
          spread: 0.4
          speed: 0.3
        # Le joueur esquive.
        dodge-sound:
          sound: "ENTITY_PLAYER_ATTACK_NODAMAGE"
          volume: 1.0
          pitch: 0.8

      # Sursaut : le regard fige le boss, mais frappé sur place sans répit il finit par se retourner contre celui qui le frappe
      # le plus. Il se téléporte derrière lui (à sa hauteur s'il vole), puis le frappe `strike-delay-ticks` plus tard : même
      # frappe esquivable que le Noir, avec les mêmes sons et particules (blackout.*). Rien ne compte pendant le Noir ni
      # pendant une phase d'invulnérabilité.
      sursaut:
        enabled: true
        # Temps, en ticks, que le boss doit passer sur place en recevant des coups. Le compteur redescend quand les coups cessent.
        pinned-ticks: 80
        # Un coup reçu compte comme « en train d'être frappé » pendant ce nombre de ticks.
        hit-window-ticks: 30
        # Le boss est « sur place » tant qu'il reste à moins de cette distance, en blocs, de l'endroit où il s'est arrêté.
        still-distance: 3.0
        # Délai entre l'avertissement (craquement, barre d'action de la cible) et la téléportation.
        warning-ticks: 12
        # Délai minimal avant le Sursaut suivant.
        cooldown-ticks: 60
        # Rayon, en blocs, autour du boss pour choisir la cible (le joueur qui l'a le plus frappé, sinon le plus proche).
        radius: 30.0
        # Distance, en blocs, entre le boss et sa cible à l'arrivée.
        blink-distance: 2.0
        # Délai entre l'arrivée du boss et sa frappe : le temps de s'écarter.
        strike-delay-ticks: 14
        # Portée de la frappe, en blocs. Au-delà, la cible l'a esquivée.
        strike-reach: 3.2
        # Dégâts normaux (arrêtés par l'armure) et part des PV max de la cible retirée en plus, directement.
        strike-damage: 14.0
        strike-true-damage-percent: 10.0
        # Force du recul de la frappe.
        strike-knockback: 0.8
        # Entendu par la cible et autour du boss pendant l'avertissement.
        warning-sound:
          sound: "ENTITY_CREAKING_ACTIVATE"
          volume: 2.0
          pitch: 0.7

    # --- SONS ET EFFETS ---
    # Le Creaking garde ses sons vanilla ; ceux-ci s'y ajoutent. Un nom vide ("") désactive un son.
    spawn-sound:
      sound: "ENTITY_CREAKING_SPAWN"
      volume: 3.0
      pitch: 0.5
    spawn-particles:
      particle: "SCULK_SOUL"
      count: 40
      spread: 0.8
      speed: 0.1
    death-sound:
      sound: "BLOCK_CREAKING_HEART_BREAK"
      volume: 2.0
      pitch: 0.5
    hurt-sound:
      sound: ""
      volume: 1.0
      pitch: 1.0
    # Le boss devient invulnérable.
    shield-start-sound:
      sound: "BLOCK_CREAKING_HEART_SPAWN"
      volume: 3.0
      pitch: 0.6
    # Le boss redevient vulnérable.
    shield-end-sound:
      sound: "ENTITY_CREAKING_DEACTIVATE"
      volume: 2.0
      pitch: 0.8
    # Un coup est reçu pendant l'invulnérabilité.
    shield-blocked-sound:
      sound: "BLOCK_RESIN_BRICKS_HIT"
      volume: 1.0
      pitch: 0.8
    # Aura autour du boss tant qu'il est invulnérable, toutes les interval-ticks ticks.
    shield-aura-particles:
      particle: "WHITE_ASH"
      count: 6
      spread: 0.6
      speed: 0.02
      interval-ticks: 4

    # --- MORT ---
    # Le coup fatal est retenu : le Creaking s'élève en tremblant, des âmes tournent autour de lui et les craquements montent ;
    # puis le final éclate (confettis dorés, éclats de bois pâle, deux anneaux d'âmes qui s'élargissent, colonne de lumière) et le
    # coup de grâce tombe. Les récompenses sont données à ce moment. Le vide et /kill passent sans scène.
    death:
      enabled: true
      duration-ticks: 80
      # Tremblement (blocs) atteint à la fin, hauteur gagnée et vitesse de rotation atteinte à la fin (degrés par tick).
      shake: 0.25
      lift: 2.5
      spin-degrees: 12.0
      # Éclats projetés au final : un bloc (vide : aucun) et leur nombre.
      debris: "PALE_OAK_LOG"
      debris-count: 70
      # Au début de la mort.
      start-sound:
        sound: "ENTITY_CREAKING_ACTIVATE"
        volume: 4.0
        pitch: 0.4
      # Toutes les pulse-interval-ticks ticks ; la hauteur monte de pulse-pitch-growth jusqu'à la fin.
      pulse-sound:
        sound: "BLOCK_CREAKING_HEART_HURT"
        volume: 2.0
        pitch: 0.5
      pulse-interval-ticks: 8
      pulse-pitch-growth: 1.2
      # Spirale autour du boss, chaque tick : count = nombre de points.
      aura-particles:
        particle: "SCULK_SOUL"
        count: 8
        speed: 0.0
      # Cœur de l'explosion finale.
      burst-particles:
        particle: "TOTEM_OF_UNDYING"
        count: 70
        spread: 1.2
        speed: 0.4
      # Anneaux qui s'élargissent jusqu'à ring-radius blocs : count = nombre de points par anneau.
      ring-particles:
        particle: "SCULK_SOUL"
        count: 48
        speed: 0.0
      ring-radius: 11.0
      # Colonne de lumière qui monte jusqu'à pillar-height blocs.
      pillar-particles:
        particle: "END_ROD"
        count: 2
        spread: 0.25
        speed: 0.02
      pillar-height: 22.0
      finale-sound:
        sound: "BLOCK_CREAKING_HEART_BREAK"
        volume: 3.0
        pitch: 0.5
      finale-extra-sound:
        sound: "ENTITY_CREAKING_DEATH"
        volume: 3.0
        pitch: 0.6
      # Entendu par les joueurs qui suivaient le combat.
      victory-sound:
        sound: "UI_TOAST_CHALLENGE_COMPLETE"
        volume: 1.0
        pitch: 1.0

    # --- RÉCOMPENSES ---
    # Elles vont à celui qui porte le coup fatal, et à lui seul. S'il s'est déconnecté pendant la mort en scène ou si le boss
    # tombe d'une autre cause, le joueur qui a le plus infligé au boss (cœurs brisés compris) le remplace.
    rewards:
      # Points d'expérience donnés au tueur.
      xp-reward: 20000
      # Nombre de fois que le tueur lance roll-commands.
      rolls: 3
      # Lancées une fois pour le tueur : un plancher garanti. Placeholders : {player} le tueur, {island} le nom de l'île (sinon de
      # son propriétaire), {world}, {x}, {y}, {z}. Pas de ';' : une commande par ligne.
      commands:
        - "shcrates givekey {player} rare 1 physical"
        - "sm {player} &7&l« &a&lSH &8&l» &7Vous venez de recevoir &c1 &6Clé Rare &7pour avoir vaincu le Boss &2&lCreaking&7."
      # Lancées `rolls` fois pour le tueur (le tirage au sort).
      roll-commands:
        - "rc creaking-rewards {player}"
      # Objets lâchés à la mort (même format que le dragon). Aucun par défaut : les récompenses passent par les commandes.
      items: []

# ----------------------------------------------------------------#
#                      PERMISSION D'ÎLE                           #
# ----------------------------------------------------------------#
# Privilège SuperiorSkyblock2 nécessaire pour lancer un rituel, le même pour les deux boss.
island-permission:
  # Le nom interne du privilège. NE PAS CHANGER après la première utilisation.
  name: "EGG_HATCH"

# ----------------------------------------------------------------#
#                         MODE RÉSEAU                             #
# ----------------------------------------------------------------#
# Actif seulement si SHSkyBridge et SHNetwork sont installés (plusieurs serveurs se partagent les îles, chacune étant
# hébergée par un seul) et 'actif' vaut true. Un serveur ne reprend et ne réveille que les boss et les rituels des îles
# qu'il héberge : ceux d'une île hébergée ailleurs ou inconnue ici restent tels quels dans hatching-data.yml et
# dormant-bosses.yml (jamais supprimés). Les commandes de récompense qui visent le tueur ({player}) passent par SHNetwork :
# elles s'exécutent là où il se trouve, une fois sa sauvegarde de passage terminée. Les boss dormants et les rituels d'une
# île suivent l'île quand SHSkyBridge la déplace. Sans eux, rien de ceci n'est utilisé. Demande un redémarrage.
reseau:
  actif: true
